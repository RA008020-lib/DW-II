<script>
    /*ler valor total conta; quantos clientes pagam a conta; calcular valor pago por cada cliente*/
    const ValorConta = Number(prompt("Insira o valor total da conta: "));
    const clientes = Number(prompt("Insira quantas pessoas irão dividir a conta: "))
    const ValorCabeca = ValorConta / clientes
    alert(`Valor da conta: ${ValorConta}\n
    Número de pessoas a dividir: ${clientes}\n
    Valor por cabeça: ${ValorCabeca}`
    )
</script>
